<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WURZEL & KRUME | Natürliches genießen</title>
    <script defer src="./js/db.js"></script>
    <script defer src="./script.js"></script>
    <script defer src="./js/template.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/standards.css">
    <link rel="stylesheet" href="./css/assets.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/basket.css">
    <link rel="shortcut icon" href="./assets/icon/Kitchen__2_-removebg-preview.png" type="image/x-icon">
</head>
<body onload="init()">
    <header id="head">
        <img src="../assets/icon/Kitchen__2_-removebg-preview.png" alt="Logo von Wurzel & KRUME">
    </header>

    <main>
        <section class="hero"></section>
        <section class="hero-content-desktop">
                <img src="../assets/icon/bx-removebg-preview.png" alt="Bild">
                <article class="hero-content-text">
                    <h1>Wurzel & Krume</h1>
                    <span class="hero-content-rating">
                        <p>★ <strong>4,9</strong></p>
                        <p>(288)</p>
                    </span>
                </article>
                <p>Real food, pure ingredients, and the beauty of sourdough.</p>
        </section>
        <section>
            <article>
                <div class="hero-content-mobile">
                    <img class="pate-pizza-icon" src="../assets/icon/bx-removebg-preview.png" alt="Bild">
                    <span class="hero-content-text-mobile">
                        <span class="hero-content-rating">
                            <p>★ <strong>4,9</strong></p>
                            <p>(288)</p>
                        </span>
                        <span class="hero-content-heading-text-mobile">
                            <h1 class="hero-content-heading-mobile">Wurzel & Krume</h1>
                            <p>Real food, pure ingredients, and the beauty of sourdough.</p>
                        </span>
                    </span>
                </div>
            </article>
        </section>
        <section id="ourMenu" class="menu">
            <h2>The Art of Sourdough Pizza</h2>
            <img    class="pizza-icon-small"
                    src="./assets/icon/Pizza-Icon-Small-removebg-preview.png" 
                    alt="Pizza Icon">

            <article id="ourDishes"></article>
        </section>
    </main>

    <dialog id="basketDialog" onclick="if(event.target === this) this.close()" class="dialog">
        <img id="cartIcon" src="./assets/icon/shopping_cart (1).png" alt="Cart Icon">
        <span id="cartCount">0</span>
    </dialog>

    <footer>
        <section class="footer-links">
            <a href="">Imprint</a>
            <a href="">Cookie Preferences</a>
            <span class="footer-icon-copyright">
                <img src="./assets/icon/copyright-regular-full.svg" alt="copyright icon">
                <a href="">2025 Wurzel & krume</a>
            </span>
        </section>
        <section class="footer-mobile">
            <article class="footer-icons">
                <a href="#head"><img src="./assets/icon/Home.png" alt="Home Icon"></a>
                <a href=""><img src="./assets/icon/Profile.png" alt="Profile Icon"></a>
                <a href=""><img src="./assets/icon/orders.png" alt="Orders Icon"></a>
                <a href="#" id="cartBtn" onclick="openBasketDialog(); return false;">
                    <img
                        id="cartIcon"
                        src="./assets/icon/shopping_cart (1).png"
                        alt="Cart Icon"
                    >
                    <span id="cartCount">0</span></a>
            </article>
        </section>
    </footer>
</body>
</html>
